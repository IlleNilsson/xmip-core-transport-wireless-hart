[package]
name = "xmip-core-transport-wireless-hart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-wireless-hart"
description = "WirelessHART transport: the HART command set in TDMA-framed DLPDUs over IEEE 802.15.4 — a Stream written and read in chunks through the device-specific commands hart defines, the network and transport layers around them; an 802.15.4 interface of Linux's kernel, or a loopback radio and its slots in process. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Standard library otherwise: the framing is bytes
# and the loopback is in this process. Its declaration takes the
# capability's `timeout` (`transport::configured::timeout`), and its radio
# is the capability's (`transport::ieee802154::Radio`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# A target read as a URI writes it (`net::Target`), and the kernel's
# 802.15.4 interface and what one frame carries above its MAC
# (`net::ieee802154`).
net = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }

# The command set, the field device and the chunked Stream are hart's
# (architecture.toml: wireless-hart depends on hart); the air is this crate's.
hart = { workspace = true, optional = true }
# A nickname a target names, in hexadecimal (`codec::hex`).
codec = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:net", "dep:hart", "dep:codec"]
# The declaration alone, with the wait its default names.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
